[workspace]
resolver = "2"
members = [
    "crates/depot-core",
    "crates/depot-ingest",
    "crates/depot-graph",
    "crates/depot-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/aphrody-dev/depot"

[workspace.dependencies]
depot-core = { path = "crates/depot-core" }
depot-ingest = { path = "crates/depot-ingest" }
depot-graph = { path = "crates/depot-graph" }

blake3 = { version = "1.6.1", features = ["mmap", "rayon"] }
clap = { version = "4.5.31", features = ["derive", "cargo"] }
colored = "2.2.0"
globset = "0.4.15"
ignore = "0.4.23"
rayon = "1.10.0"
regex = "1.11.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
toml = "0.8.20"
walkdir = "2.5.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
